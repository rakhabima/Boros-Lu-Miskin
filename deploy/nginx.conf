# Option B: Nginx on the host.
# Save as /etc/nginx/sites-available/boros-lu-miskin, then:
#   sudo ln -s /etc/nginx/sites-available/boros-lu-miskin /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d boros.rakhbim-project.my.id
# certbot adds the 443 block and the HTTP to HTTPS redirect for you.
#
# The three proxy_set_header lines are required by the app: Host for the CSRF
# origin check, X-Forwarded-Proto for the HTTPS-only receipt endpoints, and
# X-Forwarded-For (appended, last entry is trusted) for rate limiting.

server {
    listen 80;
    listen [::]:80;
    server_name boros.rakhbim-project.my.id;

    # /api/receipts accepts up to 4 MB.
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Receipt parsing can take up to 60 s (maxDuration in the route).
        proxy_read_timeout 90s;
    }
}
